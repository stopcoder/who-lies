<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="55%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0f0524"/>
    </linearGradient>
    <radialGradient id="orbGold" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#FFD27A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD27A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="20%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#8A5CFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8A5CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- iOS rounded mask handled by system; fill full square -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#orbGold)"/>
  <rect width="1024" height="1024" fill="url(#orbPurple)"/>
  <!-- gold ring -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="#FFD27A" stroke-opacity="0.35" stroke-width="6"/>
  <text x="512" y="640"
        font-size="560"
        text-anchor="middle"
        font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">🎭</text>
</svg>
